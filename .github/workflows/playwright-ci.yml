# =============================================================================
# .github/workflows/playwright-ci.yml
#
# GitHub Actions Workflow for Dynamics 365 Playwright-BDD UI Automation
# Uses the exact same scripts, Git branch locking, and single-folder report merging.
# =============================================================================

name: D365 Playwright-BDD CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '🌍 Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - uat
      filterTags:
        description: '🏷️ Test Tags (default: all — e.g. @SalesModule @Smoke)'
        required: false
        default: 'all'
        type: string
      browserName:
        description: '🌐 Target Browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      playwrightWorkers:
        description: '🔀 Browser Workers per Job (0 = Auto vCPU calculation)'
        required: false
        default: '0'
        type: string
      use_auto01:
        description: '🔑 Enable auto01'
        type: boolean
        default: false
      use_auto02:
        description: '🔑 Enable auto02'
        type: boolean
        default: false
      use_auto03:
        description: '🔑 Enable auto03'
        type: boolean
        default: false
      use_auto04:
        description: '🔑 Enable auto04'
        type: boolean
        default: false
      use_auto05:
        description: '🔑 Enable auto05'
        type: boolean
        default: false
      use_auto06:
        description: '🔑 Enable auto06'
        type: boolean
        default: false
      use_auto07:
        description: '🔑 Enable auto07'
        type: boolean
        default: false
      use_auto08:
        description: '🔑 Enable auto08'
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — Discover & Validate
  # ---------------------------------------------------------------------------
  discover:
    name: 🔍 Discover Personas
    runs-on: ubuntu-latest
    outputs:
      personaMatrix: ${{ steps.discoverStep.outputs.personaMatrix }}
      selectedAccounts: ${{ steps.accountValidation.outputs.SELECTED_ACCOUNTS }}
      selectedCount: ${{ steps.accountValidation.outputs.SELECTED_COUNT }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 25.x
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build:packages

      - name: Validate Selected Accounts
        id: accountValidation
        run: |
          SELECTED=""
          if [ "${{ inputs.use_auto01 }}" = "true" ]; then SELECTED="${SELECTED},auto01"; fi
          if [ "${{ inputs.use_auto02 }}" = "true" ]; then SELECTED="${SELECTED},auto02"; fi
          if [ "${{ inputs.use_auto03 }}" = "true" ]; then SELECTED="${SELECTED},auto03"; fi
          if [ "${{ inputs.use_auto04 }}" = "true" ]; then SELECTED="${SELECTED},auto04"; fi
          if [ "${{ inputs.use_auto05 }}" = "true" ]; then SELECTED="${SELECTED},auto05"; fi
          if [ "${{ inputs.use_auto06 }}" = "true" ]; then SELECTED="${SELECTED},auto06"; fi
          if [ "${{ inputs.use_auto07 }}" = "true" ]; then SELECTED="${SELECTED},auto07"; fi
          if [ "${{ inputs.use_auto08 }}" = "true" ]; then SELECTED="${SELECTED},auto08"; fi

          SELECTED="${SELECTED#,}"

          if [ -z "$SELECTED" ]; then
            echo "::error::No service accounts selected! You must enable at least 1 account toggle."
            exit 1
          fi

          IFS=',' read -ra ADDR <<< "$SELECTED"
          COUNT=${#ADDR[@]}

          echo "SELECTED_ACCOUNTS=$SELECTED" >> $GITHUB_OUTPUT
          echo "SELECTED_COUNT=$COUNT" >> $GITHUB_OUTPUT

      - name: Discover Personas & Build Matrix
        id: discoverStep
        env:
          FILTER_TAGS: ${{ inputs.filterTags }}
        run: |
          npx bddgen
          npx playwright test --list --reporter=json > test-manifest.json
          node .ci/scripts/parse-test-list.js

  # ---------------------------------------------------------------------------
  # STAGE 2 — Test Execution (Dynamic Matrix)
  # ---------------------------------------------------------------------------
  test-execution:
    name: 🧪 Persona @persona:${{ matrix.PERSONA }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.personaMatrix) }}
      max-parallel: ${{ fromJson(needs.discover.outputs.selectedCount) }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 25.x
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Monorepo Packages
        run: npm run build:packages

      - name: Install Playwright Browsers
        run: |
          if [ "${{ inputs.browserName }}" = "all" ]; then
            npx playwright install --with-deps
          else
            npx playwright install ${{ inputs.browserName }} --with-deps
          fi

      - name: Claim Exclusive Git Lock Branch
        id: claimAccount
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_BUILDID: ${{ github.run_id }}
          AVAILABLE_ACCOUNTS: ${{ needs.discover.outputs.selectedAccounts }}
          SERVICE_ACCOUNT_CATALOG_JSON: ${{ secrets.SERVICE_ACCOUNT_CATALOG_JSON }}
        run: bash .ci/scripts/claim-account.sh

      - name: Generate BDD Specs
        run: npm run bddgen --workspaces --if-present -- --tags "@persona:${{ matrix.PERSONA }}"

      - name: Clean Previous Timestamped Report Directories
        run: find . -type d -path "*/reports/run-*" -exec rm -rf {} + 2>/dev/null || true

      - name: Run Playwright Tests
        env:
          TEST_USERNAME: ${{ env.TEST_USERNAME }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}
          BASE_URL: ${{ secrets[format('BASE_URL_{0}', uppercase(inputs.environment))] }}
          CRM_API_URL: ${{ secrets[format('CRM_API_URL_{0}', uppercase(inputs.environment))] }}
          POWERAPP_PCIPAL_BASEURL: ${{ secrets[format('POWERAPP_PCIPAL_BASEURL_{0}', uppercase(inputs.environment))] }}
          PCIPAL_API_URL: ${{ secrets[format('PCIPAL_API_URL_{0}', uppercase(inputs.environment))] }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          DMS_CLIENT_ID: ${{ secrets.DMS_CLIENT_ID }}
          CRM_ADMIN_USERNAME: ${{ secrets.CRM_ADMIN_USERNAME }}
          CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
          BROWSER_NAME: ${{ inputs.browserName }}
          PLAYWRIGHT_WORKERS: ${{ inputs.playwrightWorkers }}
          CI: 'true'
        run: npm test --workspaces --if-present -- --grep "@persona:${{ matrix.PERSONA }}"

      - name: Stage Raw Allure Files
        if: always()
        run: |
          mkdir -p allure-raw-pkg
          find . -type d -path "*/reports/run-*/allure-results" -exec cp -r {}/. allure-raw-pkg/ \; 2>/dev/null || true

      - name: Stage Raw Allure Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-${{ matrix.PERSONA }}
          path: allure-raw-pkg
          retention-days: 7

      - name: Stage Raw Playwright Blob Files
        if: always()
        run: |
          mkdir -p blob-raw-pkg
          find . -type d -path "*/reports/run-*/blob-report" -exec cp -r {}/. blob-raw-pkg/ \; 2>/dev/null || true
          find . -type d -path "*/reports/run-*/test-results" -exec cp -r {}/. blob-raw-pkg/ \; 2>/dev/null || true
          find . -type d -name "blob-report" -exec cp -r {}/. blob-raw-pkg/ \; 2>/dev/null || true

      - name: Stage Raw Playwright Blob Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-raw-${{ matrix.PERSONA }}
          path: blob-raw-pkg
          retention-days: 7

      - name: Release Git Lock Branch
        if: always()
        env:
          LOCK_REF: ${{ env.LOCK_REF }}
          ASSIGNED_ACCOUNT: ${{ env.ASSIGNED_ACCOUNT }}
        run: bash .ci/scripts/release-account.sh

  # ---------------------------------------------------------------------------
  # STAGE 3 — Merged Reporting
  # ---------------------------------------------------------------------------
  report:
    name: 📊 Merged Report
    needs: test-execution
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 25.x
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Download Raw Allure Telemetry
        uses: actions/download-artifact@v4
        with:
          pattern: allure-raw-*
          path: allure-raw-all

      - name: Merge Allure JSON Results into allure-results Folder
        if: always()
        run: |
          mkdir -p allure-results
          find allure-raw-all -type f -exec cp {} allure-results/ \;

      - name: Upload Merged Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Download Raw Playwright Blob Telemetry
        uses: actions/download-artifact@v4
        with:
          pattern: blob-raw-*
          path: blob-raw-all

      - name: Merge Playwright Blob Reports into Single HTML Report
        if: always()
        run: |
          mkdir -p blob-report-merged
          find blob-raw-all -type f -exec cp {} blob-report-merged/ \;
          npx playwright merge-reports blob-report-merged --reporter=html

      - name: Upload Merged Playwright HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
