# =============================================================================
# .ci/azure-pipelines.yml
#
# Dynamics 365 UI Automation Pipeline — Persona-Aware Parallel Execution
# Zero External Dependencies (Git Branch Locking in Azure Repos)
# =============================================================================

trigger: none   # Manual trigger only — use "Run pipeline" in Azure DevOps UI

parameters:
  - name: environment
    displayName: '🌍 Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - uat

  - name: filterTags
    displayName: '🏷️  Test Tags (default: all — e.g. @SalesModule @Smoke)'
    type: string
    default: 'all'

  - name: browserName
    displayName: '🌐 Target Browser'
    type: string
    default: 'chromium'
    values:
      - chromium
      - firefox
      - webkit
      - all

  - name: playwrightWorkers
    displayName: '🔀 Browser Workers per Job (0 = Auto vCPU capacity calculation)'
    type: number
    default: 0

  # ── Service Account Selection Toggles (Default: false) ─────────────────────
  - name: use_auto01
    displayName: '🔑 Enable auto01'
    type: boolean
    default: false

  - name: use_auto02
    displayName: '🔑 Enable auto02'
    type: boolean
    default: false

  - name: use_auto03
    displayName: '🔑 Enable auto03'
    type: boolean
    default: false

  - name: use_auto04
    displayName: '🔑 Enable auto04'
    type: boolean
    default: false

  - name: use_auto05
    displayName: '🔑 Enable auto05'
    type: boolean
    default: false

  - name: use_auto06
    displayName: '🔑 Enable auto06'
    type: boolean
    default: false

  - name: use_auto07
    displayName: '🔑 Enable auto07'
    type: boolean
    default: false

  - name: use_auto08
    displayName: '🔑 Enable auto08'
    type: boolean
    default: false

  - name: use_auto09
    displayName: '🔑 Enable auto09'
    type: boolean
    default: false

  - name: use_auto10
    displayName: '🔑 Enable auto10'
    type: boolean
    default: false

  - name: use_auto11
    displayName: '🔑 Enable auto11'
    type: boolean
    default: false

  - name: use_auto12
    displayName: '🔑 Enable auto12'
    type: boolean
    default: false

  - name: use_auto13
    displayName: '🔑 Enable auto13'
    type: boolean
    default: false

  - name: use_auto14
    displayName: '🔑 Enable auto14'
    type: boolean
    default: false

  - name: use_auto15
    displayName: '🔑 Enable auto15'
    type: boolean
    default: false

  - name: use_auto16
    displayName: '🔑 Enable auto16'
    type: boolean
    default: false

variables:
  - group: dynamics365-service-accounts
  - name: NODE_VERSION
    value: '25.x'
  - name: SCRIPTS_DIR
    value: '$(Build.SourcesDirectory)/.ci/scripts'

stages:

  # ---------------------------------------------------------------------------
  # STAGE 1 — Discover & Validate
  # ---------------------------------------------------------------------------
  - stage: Discover
    displayName: '🔍 Discover Personas'
    jobs:
      - job: DiscoverPersonas
        displayName: 'Parse feature files & build persona matrix'
        pool:
          vmImage: ubuntu-latest
        steps:

          - checkout: self
            persistCredentials: true
            fetchDepth: 0
            displayName: 'Checkout source'

          - task: NodeTool@0
            displayName: 'Setup Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: npmAuthenticate@0
            displayName: '🔑 Authenticate npm (.npmrc)'
            inputs:
              workingFile: '$(Build.SourcesDirectory)/.npmrc'

          - script: echo "##vso[task.setvariable variable=NPM_CACHE_DIR]$(npm config get cache)"
            displayName: '🔍 Resolve OS-specific npm cache path'

          - task: Cache@2
            displayName: '📦 Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(NPM_CACHE_DIR)'

          - script: npm ci
            displayName: 'Install workspace dependencies'
            workingDirectory: '$(Build.SourcesDirectory)'

          - script: npm run build:packages
            displayName: '⚙️  Build internal monorepo packages'
            workingDirectory: '$(Build.SourcesDirectory)'

          - script: node $(SCRIPTS_DIR)/cleanup-stale-locks.js
            displayName: '🧹 Clean up stale locks from finished builds'
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          - bash: |
              SELECTED=""
              ${{ if eq(parameters.use_auto01, true) }}:
                SELECTED="${SELECTED},auto01"
              ${{ if eq(parameters.use_auto02, true) }}:
                SELECTED="${SELECTED},auto02"
              ${{ if eq(parameters.use_auto03, true) }}:
                SELECTED="${SELECTED},auto03"
              ${{ if eq(parameters.use_auto04, true) }}:
                SELECTED="${SELECTED},auto04"
              ${{ if eq(parameters.use_auto05, true) }}:
                SELECTED="${SELECTED},auto05"
              ${{ if eq(parameters.use_auto06, true) }}:
                SELECTED="${SELECTED},auto06"
              ${{ if eq(parameters.use_auto07, true) }}:
                SELECTED="${SELECTED},auto07"
              ${{ if eq(parameters.use_auto08, true) }}:
                SELECTED="${SELECTED},auto08"
              ${{ if eq(parameters.use_auto09, true) }}:
                SELECTED="${SELECTED},auto09"
              ${{ if eq(parameters.use_auto10, true) }}:
                SELECTED="${SELECTED},auto10"
              ${{ if eq(parameters.use_auto11, true) }}:
                SELECTED="${SELECTED},auto11"
              ${{ if eq(parameters.use_auto12, true) }}:
                SELECTED="${SELECTED},auto12"
              ${{ if eq(parameters.use_auto13, true) }}:
                SELECTED="${SELECTED},auto13"
              ${{ if eq(parameters.use_auto14, true) }}:
                SELECTED="${SELECTED},auto14"
              ${{ if eq(parameters.use_auto15, true) }}:
                SELECTED="${SELECTED},auto15"
              ${{ if eq(parameters.use_auto16, true) }}:
                SELECTED="${SELECTED},auto16"
              
              SELECTED="${SELECTED#,}"

              if [ -z "$SELECTED" ]; then
                echo "##[error] No service accounts selected! You must enable at least 1 account toggle (use_auto01...16) in the run parameters."
                exit 1
              fi

              IFS=',' read -ra ADDR <<< "$SELECTED"
              COUNT=${#ADDR[@]}

              echo "Selected account count: $COUNT ($SELECTED)"
              echo "##vso[task.setvariable variable=SELECTED_ACCOUNTS;isOutput=true]$SELECTED"
              echo "##vso[task.setvariable variable=SELECTED_COUNT;isOutput=true]$COUNT"
            displayName: '📋 Validate & count selected service accounts'
            name: accountSelectionStep

          - script: npm run discover
            displayName: '🔍 Discover tests & build persona matrix'
            name: discoverStep
            env:
              FILTER_TAGS: '${{ parameters.filterTags }}'

  # ---------------------------------------------------------------------------
  # STAGE 2 — Test Execution (Dynamic Matrix)
  # ---------------------------------------------------------------------------
  - stage: TestExecution
    displayName: '🧪 Test Execution'
    dependsOn: Discover
    condition: succeeded('Discover')
    jobs:
      - job: RunTests
        displayName: 'Persona Bucket — @persona:$(PERSONA) [Account: $(ASSIGNED_ACCOUNT)]'
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 5
        pool:
          vmImage: ubuntu-latest
        variables:
          AVAILABLE_ACCOUNTS: $[ stageDependencies.Discover.DiscoverPersonas.outputs['accountSelectionStep.SELECTED_ACCOUNTS'] ]

        strategy:
          matrix: $[ stageDependencies.Discover.DiscoverPersonas.outputs['discoverStep.personaMatrix'] ]
          maxParallel: $[ stageDependencies.Discover.DiscoverPersonas.outputs['accountSelectionStep.SELECTED_COUNT'] ]

        steps:

          - checkout: self
            persistCredentials: true
            fetchDepth: 1
            displayName: 'Checkout source'

          - task: NodeTool@0
            displayName: 'Setup Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: npmAuthenticate@0
            displayName: '🔑 Authenticate npm (.npmrc)'
            inputs:
              workingFile: '$(Build.SourcesDirectory)/.npmrc'

          - script: echo "##vso[task.setvariable variable=NPM_CACHE_DIR]$(npm config get cache)"
            displayName: '🔍 Resolve OS-specific npm cache path'

          - task: Cache@2
            displayName: '📦 Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(NPM_CACHE_DIR)'

          - script: npm ci
            displayName: 'Install workspace dependencies'
            workingDirectory: '$(Build.SourcesDirectory)'

          - script: npm run build:packages
            displayName: '⚙️  Build internal monorepo packages'
            workingDirectory: '$(Build.SourcesDirectory)'

          - ${{ if eq(parameters.browserName, 'all') }}:
            - script: npx playwright install --with-deps
              displayName: '🌐 Install all Playwright browser binaries'
              workingDirectory: '$(Build.SourcesDirectory)'
          - ${{ if ne(parameters.browserName, 'all') }}:
            - script: npx playwright install ${{ parameters.browserName }} --with-deps
              displayName: '🌐 Install Playwright browser binary (${{ parameters.browserName }})'
              workingDirectory: '$(Build.SourcesDirectory)'

          - bash: bash $(SCRIPTS_DIR)/claim-account.sh
            displayName: '🔑 Claim exclusive service account for slot'
            env:
              ENVIRONMENT: '${{ parameters.environment }}'
              BUILD_BUILDID: '$(Build.BuildId)'
              AVAILABLE_ACCOUNTS: '$(AVAILABLE_ACCOUNTS)'
              SERVICE_ACCOUNT_CATALOG_JSON: $(SERVICE_ACCOUNT_CATALOG_JSON)

          - script: npm run bddgen --workspaces --if-present -- --tags "@persona:$(PERSONA)"
            displayName: '⚙️  Generate BDD specs for @persona:$(PERSONA)'
            workingDirectory: '$(Build.SourcesDirectory)'

          - script: npm test --workspaces --if-present -- --grep "@persona:$(PERSONA)"
            displayName: '▶️  Run Playwright tests for @persona:$(PERSONA)'
            workingDirectory: '$(Build.SourcesDirectory)'
            env:
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)
              BASE_URL: $(BASE_URL_${{ upper(parameters.environment) }})
              CRM_API_URL: $(CRM_API_URL_${{ upper(parameters.environment) }})
              POWERAPP_PCIPAL_BASEURL: $(POWERAPP_PCIPAL_BASEURL_${{ upper(parameters.environment) }})
              PCIPAL_API_URL: $(PCIPAL_API_URL_${{ upper(parameters.environment) }})
              TENANT_ID: $(TENANT_ID)
              DMS_CLIENT_ID: $(DMS_CLIENT_ID)
              CRM_ADMIN_USERNAME: $(CRM_ADMIN_USERNAME)
              CRM_ADMIN_PASSWORD: $(CRM_ADMIN_PASSWORD)
              BROWSER_NAME: '${{ parameters.browserName }}'
              PLAYWRIGHT_WORKERS: '${{ parameters.playwrightWorkers }}'
              CI: 'true'

          - task: PublishTestResults@2
            displayName: '📋 Publish JUnit XML test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/junit/*.xml'
              searchFolder: '$(Build.SourcesDirectory)'
              testRunTitle: '@persona:$(PERSONA) — ${{ parameters.environment }}'
              mergeTestResults: true

          - bash: |
              mkdir -p $(Build.ArtifactStagingDirectory)/raw-data
              find . -type d -name "blob-report" -exec cp -r {} $(Build.ArtifactStagingDirectory)/raw-data/ \; 2>/dev/null || true
              find . -type d -name "allure-results" -exec cp -r {} $(Build.ArtifactStagingDirectory)/raw-data/ \; 2>/dev/null || true
              find . -type d -name "test-results" -exec cp -r {} $(Build.ArtifactStagingDirectory)/raw-data/ \; 2>/dev/null || true
            displayName: '📁 Package lightweight raw test data (blob-report & allure-results)'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: '📦 Upload raw test data artifact'
            condition: always()
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/raw-data'
              artifact: 'raw-data-$(PERSONA)'

          - bash: bash $(SCRIPTS_DIR)/release-account.sh
            displayName: '🔑 Release service account Git lock'
            condition: always()
            env:
              LOCK_REF: $(LOCK_REF)
              ASSIGNED_ACCOUNT: $(ASSIGNED_ACCOUNT)

  # ---------------------------------------------------------------------------
  # STAGE 3 — Merged Reporting (Single-Folder Artifacts Only)
  # ---------------------------------------------------------------------------
  - stage: Report
    displayName: '📊 Merged Report'
    dependsOn:
      - Discover
      - TestExecution
    condition: and(succeeded('Discover'), in(dependencies.TestExecution.result, 'Succeeded', 'SucceededWithIssues', 'Failed'))
    jobs:
      - job: PublishMergedReport
        displayName: 'Merge & publish single-folder HTML & Allure reports'
        pool:
          vmImage: ubuntu-latest
        steps:

          - checkout: self
            persistCredentials: true
            fetchDepth: 1

          - task: NodeTool@0
            displayName: 'Setup Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: npmAuthenticate@0
            displayName: '🔑 Authenticate npm (.npmrc)'
            inputs:
              workingFile: '$(Build.SourcesDirectory)/.npmrc'

          - script: echo "##vso[task.setvariable variable=NPM_CACHE_DIR]$(npm config get cache)"
            displayName: '🔍 Resolve OS-specific npm cache path'

          - task: Cache@2
            displayName: '📦 Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: '$(NPM_CACHE_DIR)'

          - script: npm ci
            displayName: 'Install workspace dependencies'

          - task: DownloadPipelineArtifact@2
            displayName: '⬇️  Download raw test data from all jobs'
            inputs:
              buildType: 'current'
              itemPattern: 'raw-data-*/**'
              targetPath: '$(Pipeline.Workspace)/all-raw'

          - bash: |
              mkdir -p allure-results
              find $(Pipeline.Workspace)/all-raw -type f -name "*-result.json" -exec cp {} allure-results/ \;
              echo "Merged Allure JSON files:"
              ls -l allure-results | head -10
            displayName: '📊 Merge Allure JSON results into single folder'
            condition: always()

          - bash: |
              npx playwright merge-reports $(Pipeline.Workspace)/all-raw/raw-data-*/blob-report --reporter=html
            displayName: '🌐 Merge Playwright Blob Reports into single unified HTML report'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: '📦 Publish merged allure-results artifact'
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/allure-results'
              artifact: 'allure-results'

          - task: PublishPipelineArtifact@1
            displayName: '📦 Publish merged playwright-report HTML artifact'
            condition: always()
            inputs:
              targetPath: '$(Build.SourcesDirectory)/playwright-report'
              artifact: 'playwright-report'
